# 1台のホストに、DB とエンジンを立てる。外へ開く口は 127.0.0.1:3133 の1つだけ。
name: kioku
services:
  db:
    build: { context: ., dockerfile: docker/db.Dockerfile }
    environment:
      POSTGRES_USER: kioku
      POSTGRES_PASSWORD: ${KIOKU_DB_PASSWORD:?先に ./kioku up を実行してください（.env を作ります）}
      POSTGRES_DB: kioku
    volumes:
      - db:/var/lib/postgresql/data
      - ./kit/nihongo-kensaku:/kit:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kioku -d kioku"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  engine:
    build: { context: ., dockerfile: docker/engine.Dockerfile }
    depends_on:
      db: { condition: service_healthy }
    environment:
      KIOKU_DB_PASSWORD: ${KIOKU_DB_PASSWORD:?}
      KIOKU_PUBLIC_URL: ${KIOKU_PUBLIC_URL:-}
    volumes:
      - home:/data
      - ./docs:/srv/kioku/docs
      - ./config:/srv/kioku/config:ro
      - ./keys:/srv/kioku/keys
    ports:
      - "127.0.0.1:${KIOKU_PORT:-3133}:3133"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3133/health').catch(()=>null);process.exit(r&&r.ok?0:1)"]
      interval: 5s
      timeout: 4s
      retries: 60
      start_period: 20s
    restart: unless-stopped
volumes:
  db:
  home:
